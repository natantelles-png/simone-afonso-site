name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 min: publica textos novos e agendados
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install pillow playwright
          playwright install --with-deps chromium
      - name: Montar a página inicial
        run: python3 build/build.py
      - name: Gerar o blog (páginas fixas, sitemap, feed, llms.txt)
        run: python3 blog/build_blog.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Pré-renderizar a página inicial
        run: python3 build/prerender.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
