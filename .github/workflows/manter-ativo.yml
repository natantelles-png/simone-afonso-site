# O GitHub desliga tarefas agendadas após 60 dias sem atividade no repositório.
# Este arquivo registra um commit por mês para manter a publicação automática ligada.
name: Manter ativo

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atividade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d" > .github/ultima-atividade.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .github/ultima-atividade.txt
          git commit -m "Registro mensal de atividade" || echo "nada a registrar"
          git push
